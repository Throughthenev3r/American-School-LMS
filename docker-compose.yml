# LMS PostgreSQL with pgvector
# Port 5433 to avoid conflict with local PostgreSQL on 5432
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: lms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lms_school
    ports:
      - "5434:5432"
    volumes:
      - lms_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lms_school"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lms_pgdata:
